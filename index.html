<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiv Enterprises Management Software</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1320;
      color: #f8fafc;
      padding: 20px;
    }

    .center-wrap {
      min-height: calc(100vh - 40px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #131f33;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .brand-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1320;
      color: #ffffff;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #38bdf8;
    }

    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #0284c7;
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s;
    }

    .btn-primary:hover:not(:disabled) {
      background: #0369a1;
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 14px;
      color: #94a3b8;
      font-size: 12.5px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(148, 163, 184, 0.2);
    }

    .btn-secondary {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #334155;
    }

    .status-msg {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      display: none;
    }

    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .status-info {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    /* Dashboard */
    .dashboard {
      display: none;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    .dash-header {
      background: #131f33;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 18px 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .dash-title {
      font-size: 20px;
      font-weight: 700;
    }

    .user-email {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 3px;
    }

    .btn-logout {
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-logout:hover {
      background: #334155;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
      margin-bottom: 18px;
    }

    .panel {
      background: #131f33;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 20px;
    }

    .panel h2 {
      font-size: 17px;
      margin-bottom: 14px;
      color: #38bdf8;
    }

    .row-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .record-item {
      background: #0b1320;
      border: 1px solid #24344d;
      border-radius: 12px;
      padding: 13px 14px;
      margin-top: 10px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .record-meta {
      color: #94a3b8;
      font-size: 12.5px;
    }

    .empty-note {
      color: #94a3b8;
      font-size: 13.5px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Login View -->
  <div class="center-wrap" id="loginWrap">
    <div class="login-card">
      <div class="brand-tag">Authorized Access</div>
      <h1>Shiv Enterprises Management Software</h1>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Gmail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Apna password darj karein"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">Login</button>

        <div class="divider">YA</div>

        <button type="button" class="btn-secondary" id="emailLinkBtn">
          Gmail Par Sign-In Link Bhejein
        </button>

        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>
  </div>

  <!-- Dashboard View -->
  <div class="dashboard" id="dashboardWrap">
    <div class="dash-header">
      <div>
        <div class="dash-title">Shiv Enterprises Management Software</div>
        <div class="user-email" id="loggedInUser"></div>
      </div>
      <button type="button" class="btn-logout" id="logoutBtn">Logout</button>
    </div>

    <div class="grid-2">
      <!-- Entry Form -->
      <div class="panel">
        <h2>Nayi Entry / Record</h2>
        <form id="entryForm">
          <div class="row-2">
            <div class="form-group">
              <label for="recName">Naam</label>
              <input type="text" id="recName" placeholder="Poora naam" required />
            </div>
            <div class="form-group">
              <label for="recMobile">Mobile Number</label>
              <input type="tel" id="recMobile" placeholder="10-ank mobile" required />
            </div>
          </div>

          <div class="row-2">
            <div class="form-group">
              <label for="recAge">Age</label>
              <input type="number" id="recAge" placeholder="Age" min="1" max="120" />
            </div>
            <div class="form-group">
              <label for="recVisitDate">Visit Date</label>
              <input type="date" id="recVisitDate" required />
            </div>
          </div>

          <div class="form-group">
            <label for="recAddress">Address</label>
            <input type="text" id="recAddress" placeholder="Pata / Area" />
          </div>

          <div class="row-2">
            <div class="form-group">
              <label for="recService">Treatment / Service</label>
              <input type="text" id="recService" placeholder="Service / Detail" required />
            </div>
            <div class="form-group">
              <label for="recBilling">Billing Amount (₹)</label>
              <input type="number" id="recBilling" placeholder="0" min="0" />
            </div>
          </div>

          <div class="form-group">
            <label for="recNextDate">Next Appointment Date</label>
            <input type="date" id="recNextDate" />
          </div>

          <button type="submit" class="btn-primary" id="saveEntryBtn">Record Save Karein</button>
          <div class="status-msg" id="entryStatus"></div>
        </form>
      </div>

      <!-- Lookup & Records -->
      <div class="panel">
        <h2>Mobile / Naam Se Search & History</h2>
        <div class="form-group">
          <label for="searchInput">Mobile Number ya Naam Khojein</label>
          <input
            type="text"
            id="searchInput"
            placeholder="Mobile number ya naam likhein..."
          />
        </div>
        <div id="recordsList">
          <p class="empty-note">Records load ho rahe hain...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyALwvUvNPNcug9IJuwjaCRYLcD66nkoBmo",
      authDomain: "shiv-enterprises-ccc3e.firebaseapp.com",
      projectId: "shiv-enterprises-ccc3e",
      storageBucket: "shiv-enterprises-ccc3e.firebasestorage.app",
      messagingSenderId: "80655329898",
      appId: "1:80655329898:web:7936e357000cc87f927813",
      measurementId: "G-0ZEX0ZSCEG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginWrap = document.getElementById("loginWrap");
    const dashboardWrap = document.getElementById("dashboardWrap");
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const emailLinkBtn = document.getElementById("emailLinkBtn");
    const statusMsg = document.getElementById("statusMsg");
    const loggedInUser = document.getElementById("loggedInUser");
    const logoutBtn = document.getElementById("logoutBtn");

    const entryForm = document.getElementById("entryForm");
    const saveEntryBtn = document.getElementById("saveEntryBtn");
    const entryStatus = document.getElementById("entryStatus");
    const searchInput = document.getElementById("searchInput");
    const recordsList = document.getElementById("recordsList");

    let allRecords = [];
    let unsubscribeRecords = null;

    // Default visit date = aaj ki date
    document.getElementById("recVisitDate").valueAsDate = new Date();

    function setBoxMessage(el, message, type = "error") {
      el.textContent = message;
      el.className = "status-msg " + (type === "info" ? "status-info" : "status-error");
      el.style.display = "block";
    }

    function clearBoxMessage(el) {
      el.textContent = "";
      el.style.display = "none";
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderRecords() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = allRecords.filter((r) => {
        if (!q) return true;
        const name = (r.name || "").toLowerCase();
        const mobile = (r.mobile || "").toLowerCase();
        const service = (r.service || "").toLowerCase();
        return name.includes(q) || mobile.includes(q) || service.includes(q);
      });

      if (!filtered.length) {
        recordsList.innerHTML = `<p class="empty-note">Koi record nahi mila.</p>`;
        return;
      }

      recordsList.innerHTML = filtered
        .slice(0, 30)
        .map(
          (r) => `
          <div class="record-item">
            <div class="record-top">
              <span>${escapeHtml(r.name)} (${escapeHtml(r.mobile)})</span>
              <span>₹${escapeHtml(r.billing || 0)}</span>
            </div>
            <div class="record-meta">
              Service: ${escapeHtml(r.service)} | Visit: ${escapeHtml(r.visitDate || "-")}
              ${r.nextAppointment ? ` | Next: ${escapeHtml(r.nextAppointment)}` : ""}
            </div>
            ${
              r.age || r.address
                ? `<div class="record-meta">${r.age ? `Age: ${escapeHtml(r.age)}` : ""}${
                    r.age && r.address ? " • " : ""
                  }${r.address ? `Address: ${escapeHtml(r.address)}` : ""}</div>`
                : ""
            }
          </div>
        `
        )
        .join("");
    }

    function startRecordsListener() {
      if (unsubscribeRecords) unsubscribeRecords();
      const q = query(collection(db, "records"), orderBy("createdAt", "desc"));
      unsubscribeRecords = onSnapshot(
        q,
        (snapshot) => {
          allRecords = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
          renderRecords();
        },
        (err) => {
          recordsList.innerHTML = `<p class="empty-note">Database load nahi ho paaya (Firestore rules/setup check karein): ${escapeHtml(
            err.message
          )}</p>`;
        }
      );
    }

    async function completeEmailLinkSignIn() {
      if (!isSignInWithEmailLink(auth, window.location.href)) return;

      let emailForSignIn = window.localStorage.getItem("shivEmailForSignIn");
      if (!emailForSignIn) {
        emailForSignIn = window.prompt("Kripya apna Gmail address confirm karein:");
      }

      if (!emailForSignIn) {
        setBoxMessage(statusMsg, "Login poora karne ke liye Gmail address zaroori hai.", "error");
        return;
      }

      try {
        await signInWithEmailLink(auth, emailForSignIn, window.location.href);
        window.localStorage.removeItem("shivEmailForSignIn");
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (err) {
        setBoxMessage(statusMsg, "Email link login mein samasya aayi: " + err.message, "error");
      }
    }

    completeEmailLinkSignIn();

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginWrap.style.display = "none";
        dashboardWrap.style.display = "block";
        loggedInUser.textContent = "Logged in as: " + user.email;
        startRecordsListener();
      } else {
        if (unsubscribeRecords) {
          unsubscribeRecords();
          unsubscribeRecords = null;
        }
        dashboardWrap.style.display = "none";
        loginWrap.style.display = "flex";
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearBoxMessage(statusMsg);

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        if (
          err.code === "auth/invalid-credential" ||
          err.code === "auth/user-not-found" ||
          err.code === "auth/wrong-password"
        ) {
          setBoxMessage(statusMsg, "Galat Gmail ya password hai. Kripya dobara check karein.", "error");
        } else if (err.code === "auth/invalid-email") {
          setBoxMessage(statusMsg, "Kripya sahi Gmail address likhein.", "error");
        } else {
          setBoxMessage(statusMsg, "Login mein samasya aayi: " + err.message, "error");
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });

    emailLinkBtn.addEventListener("click", async () => {
      clearBoxMessage(statusMsg);
      const email = document.getElementById("email").value.trim();

      if (!email) {
        setBoxMessage(statusMsg, "Pehle upar Gmail box mein apna email address likhein.", "error");
        return;
      }

      const actionCodeSettings = {
        url: window.location.origin + window.location.pathname,
        handleCodeInApp: true
      };

      emailLinkBtn.disabled = true;
      emailLinkBtn.textContent = "Link bheja ja raha hai...";

      try {
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        window.localStorage.setItem("shivEmailForSignIn", email);
        setBoxMessage(
          statusMsg,
          "Sign-in link " + email + " par bhej diya gaya hai. Gmail inbox (ya Spam) check karke link par tap karein.",
          "info"
        );
      } catch (err) {
        setBoxMessage(statusMsg, "Link bhejne mein samasya aayi: " + err.message, "error");
      } finally {
        emailLinkBtn.disabled = false;
        emailLinkBtn.textContent = "Gmail Par Sign-In Link Bhejein";
      }
    });

    entryForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearBoxMessage(entryStatus);

      const data = {
        name: document.getElementById("recName").value.trim(),
        mobile: document.getElementById("recMobile").value.trim(),
        age: document.getElementById("recAge").value.trim(),
        address: document.getElementById("recAddress").value.trim(),
        visitDate: document.getElementById("recVisitDate").value,
        service: document.getElementById("recService").value.trim(),
        billing: Number(document.getElementById("recBilling").value || 0),
        nextAppointment: document.getElementById("recNextDate").value,
        createdBy: auth.currentUser?.email || "",
        createdAt: serverTimestamp()
      };

      saveEntryBtn.disabled = true;
      saveEntryBtn.textContent = "Save ho raha hai...";

      try {
        await addDoc(collection(db, "records"), data);
        entryForm.reset();
        document.getElementById("recVisitDate").valueAsDate = new Date();
        setBoxMessage(entryStatus, "Record safalta se save ho gaya!", "info");
      } catch (err) {
        setBoxMessage(entryStatus, "Save karne mein samasya aayi: " + err.message, "error");
      } finally {
        saveEntryBtn.disabled = false;
        saveEntryBtn.textContent = "Record Save Karein";
      }
    });

    searchInput.addEventListener("input", renderRecords);

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });
  </script>
</body>
</html>
