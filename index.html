<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shiv Enterprises</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.3;
      margin-bottom: 14px;
      color: #ffffff;
    }

    p {
      font-size: 17px;
      line-height: 1.65;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .footer-note {
      font-size: 13px;
      color: #94a3b8;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Welcome</div>
    <h1>Shiv Enterprises</h1>
    <p>
      Shiv Enterprises mein aapka hardik swagat hai, jald hi hum aapki seva mein haazir honge.
    </p>
    <div class="footer-note">
      Management Portal • Coming Soon
    </div>
  </main>
</body>
</html>
